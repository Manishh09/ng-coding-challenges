<div class="page">

  @if (loading) {
    <div class="loading-center">
      <mat-spinner diameter="40" />
      <p>Loading products...</p>
    </div>
  } @else {
    <mat-card>
      <mat-card-content class="table-content">
        <table mat-table [dataSource]="productList" class="product-table">

          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let p">{{ p.id }}</td>
          </ng-container>

          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let p" class="title-cell">{{ p.title }}</td>
          </ng-container>

          <ng-container matColumnDef="category">
            <th mat-header-cell *matHeaderCellDef>Category</th>
            <td mat-cell *matCellDef="let p">
              <mat-chip-set>
                <mat-chip>{{ p.category }}</mat-chip>
              </mat-chip-set>
            </td>
          </ng-container>

          <ng-container matColumnDef="price">
            <th mat-header-cell *matHeaderCellDef class="r">Price</th>
            <td mat-cell *matCellDef="let p" class="r price-cell">
              {{ p.price | currency:'USD':'symbol':'1.2-2' }}
            </td>
          </ng-container>

          <ng-container matColumnDef="rating">
            <th mat-header-cell *matHeaderCellDef class="r">Rating</th>
            <td mat-cell *matCellDef="let p" class="r">
              <span class="rating-value">{{ p.rating.rate }}</span>
              <span class="rating-count">({{ p.rating.count }})</span>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell empty" colspan="5">No Products Available</td>
          </tr>

        </table>
      </mat-card-content>
    </mat-card>
  }

</div>
